name: Build job images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['labs/**', '.github/workflows/build-job-images.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - job: demo-main
            directory: 01-demo-main
          - job: ynat
            directory: 02-ynat
          - job: fashion
            directory: 03-fashion
          - job: llm03
            directory: 04-llm03
          - job: ynat-resume
            directory: 05-ynat-resume
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          JOB: ${{ matrix.job }}
          LAB_DIRECTORY: ${{ matrix.directory }}
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.source=https://github.com/SCPv2/sat-training-labs" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "ghcr.io/scpv2/sat-training-labs:$JOB-cuda" "labs/$LAB_DIRECTORY"
      - name: Check Python syntax
        env:
          JOB: ${{ matrix.job }}
        run: |
          docker run --rm --entrypoint python "ghcr.io/scpv2/sat-training-labs:$JOB-cuda" -m compileall -q .
          docker run --rm --entrypoint python "ghcr.io/scpv2/sat-training-labs:$JOB-cuda" -c 'import train'
          if [ "$JOB" = demo-main ]; then
            docker run --rm --entrypoint test "ghcr.io/scpv2/sat-training-labs:$JOB-cuda" -s /opt/requirements-resolved.txt
          fi
      - name: Publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB: ${{ matrix.job }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/scpv2/sat-training-labs:$JOB-cuda"
