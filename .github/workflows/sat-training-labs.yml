name: Publish SAT lab images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'labs/sat-local-training/**'
      - '.github/workflows/sat-training-labs.yml'
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [cpu, cu124]
    steps:
      - uses: actions/checkout@v4
      - name: Build lab image
        run: |
          docker build --platform linux/amd64 \
            --build-arg TORCH_CHANNEL=${{ matrix.channel }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t ghcr.io/scpv2/sat-training-labs:${{ matrix.channel }} \
            labs/sat-local-training
      - name: Smoke test CPU training
        if: matrix.channel == 'cpu'
        run: |
          image=ghcr.io/scpv2/sat-training-labs:cpu
          docker run --rm "$image" python train.py --task synthetic_images --epochs 1 --device cpu --run-dir /results/cnn
          docker run --rm "$image" python train.py --task csv --csv-file samples/dataset.csv --epochs 1 --device cpu --run-dir /results/csv
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/scpv2/sat-training-labs:${{ matrix.channel }}
